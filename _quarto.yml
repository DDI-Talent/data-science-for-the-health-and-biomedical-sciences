project:
  type: website
  output-dir: "_site"
  post-render:
    - python3 scripts/legacy-redirects.py
  resources:
    - documents/**/*
    # Retained supporting sources with no website links.
    - "!documents/week-2/phs_cancelled_tidy.Rda"
    - "!documents/week-3/Be_fruitful_and_multiply.pdf"
    - "!documents/week-4/Combined_example.Rmd"
    - "!tutorials/**"
    - "!scripts/**"
    - "!README.md"
  render:
    - index.qmd
    - weeks.qmd
    - course-guide.qmd
    - week-1/*.qmd
    - week-2/*.qmd
    - week-3/*.qmd
    - week-4/*.qmd
    - week-5/*.qmd
    - week-6/*.qmd
    - week-7/*.qmd
    - week-8/*.qmd
    - week-9/*.qmd
    - week-10/*.qmd
    - "!tutorials/**"
    - course-information/*.qmd
  preview:
    port: 5133

execute:
  freeze: true
  eval: false

website:
  title: "Data Science for Health and Biomedical Sciences"
  description: "The course aims to provide a broad introduction to data science in health and biomedical sciences, covering key concepts and principles, data analysis skills and implications of working with biomedical and healthcare data."
  site-url: "https://ddi-talent.github.io/data-science-for-the-health-and-biomedical-sciences/"
  favicon: "/favicon.png"
  page-navigation: true
  back-to-top-navigation: true
  repo-url: "https://github.com/DDI-Talent/data-science-for-the-health-and-biomedical-sciences"
  repo-actions: [edit, issue]
  page-footer:
    left: "The University of Edinburgh · Edinburgh Medical School"
    right: "A living course notebook built with Quarto"
  navbar:
    pinned: true
    background: "#041e42"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Home
      - href: course-guide.qmd
        text: Course guide
      - href: weeks.qmd
        text: Weeks
      - href: course-information/gen-ai-guidance.qmd
        text: Gen AI guidance
    right:
      - icon: github
        href: "https://github.com/DDI-Talent/data-science-for-the-health-and-biomedical-sciences"
        aria-label: GitHub repository

  sidebar:
    - title: "Content"
      style: "docked"
      search: true
      collapse-level: 1
      contents:
        - text: Course home
          href: index.qmd
        - text: How to use this site
          href: course-guide.qmd
        - text: All weeks
          href: weeks.qmd
